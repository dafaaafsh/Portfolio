<article class="game-panel" id="number-game">
    <div class="mb-5">
        <span class="game-icon" aria-hidden="true">🔢</span>
        <h3 class="mt-3 text-2xl font-bold text-white">Tebak Angka</h3>
        <p class="mt-2 text-sm text-gray-300">Cari angka rahasia dari 1 sampai 20.</p>
    </div>
    <form class="number-form" id="number-form">
        <label class="sr-only" for="number-input">Tebakan angka 1 sampai 20</label>
        <input id="number-input" type="number" min="1" max="20" inputmode="numeric"
            placeholder="Angka 1–20" required>
        <button class="game-secondary-button" type="submit">Tebak</button>
    </form>
    <p class="game-status" id="number-status" aria-live="polite"></p>
    <button class="game-text-button" id="number-restart" type="button">Angka baru</button>
</article>
