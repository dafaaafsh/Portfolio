<article class="game-panel" id="snake-game">
    <div class="mb-5">
        <span class="game-icon" aria-hidden="true">🐍</span>
        <h3 class="mt-3 text-2xl font-bold text-white">Snake Arcade</h3>
        <p class="mt-2 text-sm text-gray-300">Makan buah dan hindari menabrak diri sendiri.</p>
    </div>
    <canvas aria-label="Papan permainan Snake. Gunakan tombol panah atau WASD untuk bergerak."
        class="snake-board" height="320" id="snake-canvas" tabindex="0" width="320"></canvas>
    <div class="snake-controls" aria-label="Kontrol arah Snake">
        <span></span>
        <button aria-label="Gerak ke atas" data-snake-direction="up" type="button">▲</button>
        <span></span>
        <button aria-label="Gerak ke kiri" data-snake-direction="left" type="button">◀</button>
        <button aria-label="Gerak ke bawah" data-snake-direction="down" type="button">▼</button>
        <button aria-label="Gerak ke kanan" data-snake-direction="right" type="button">▶</button>
    </div>
    <p class="game-status" id="snake-status" aria-live="polite">Tekan Mulai untuk bermain.</p>
    <p class="snake-score">Skor: <span id="snake-score">0</span></p>
    <button class="game-secondary-button" id="snake-start" type="button">Mulai</button>
    <p class="mt-3 text-xs text-gray-400">Kontrol: tombol panah atau WASD. Kamu juga bisa memakai tombol arah.</p>
</article>
