<article class="game-panel" id="memory-game">
    <div class="mb-5">
        <span class="game-icon" aria-hidden="true">🧠</span>
        <h3 class="mt-3 text-2xl font-bold text-white">Memory Match</h3>
        <p class="mt-2 text-sm text-gray-300">Buka kartu dan temukan keenam pasangan emoji.</p>
    </div>
    <div class="memory-board" id="memory-board" aria-label="Papan permainan Memory Match"></div>
    <p class="game-status" id="memory-status" aria-live="polite"></p>
    <button class="game-secondary-button" id="memory-restart" type="button">Acak ulang</button>
</article>
