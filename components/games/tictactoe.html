<article class="game-panel" id="tictactoe-game">
    <div class="mb-5">
        <span class="game-icon" aria-hidden="true">⭕</span>
        <h3 class="mt-3 text-2xl font-bold text-white">Tic-Tac-Toe</h3>
        <p class="mt-2 text-sm text-gray-300">Mainkan berdua dan susun tiga simbol secara berurutan.</p>
    </div>
    <div aria-label="Papan Tic-Tac-Toe" class="tictactoe-board" id="tictactoe-board" role="group">
        <button aria-label="Kotak 1, kosong" type="button"></button>
        <button aria-label="Kotak 2, kosong" type="button"></button>
        <button aria-label="Kotak 3, kosong" type="button"></button>
        <button aria-label="Kotak 4, kosong" type="button"></button>
        <button aria-label="Kotak 5, kosong" type="button"></button>
        <button aria-label="Kotak 6, kosong" type="button"></button>
        <button aria-label="Kotak 7, kosong" type="button"></button>
        <button aria-label="Kotak 8, kosong" type="button"></button>
        <button aria-label="Kotak 9, kosong" type="button"></button>
    </div>
    <p class="game-status" id="tictactoe-status" aria-live="polite"></p>
    <button class="game-secondary-button" id="tictactoe-restart" type="button">Main lagi</button>
</article>
