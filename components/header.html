<header class="flex flex-wrap justify-between items-center px-4 sm:px-6 py-4 sm:py-6 bg-gradient-to-r from-blue-900/60 via-gray-900/80 to-indigo-900/60 shadow-lg sticky top-0 z-50 backdrop-blur-md transition-all duration-300" id="main-header">
    <div class="flex items-center gap-4 select-none">
        <span class="text-blue-500 text-3xl animate-spin-slow drop-shadow-lg">
            <svg class="w-9 h-9" fill="none" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <rect fill="#2563eb" height="18" rx="4" width="18" x="3" y="3"></rect>
                <path d="M8 8h8v2H8zm0 4h5v2H8z" fill="#fff"></path>
            </svg>
        </span>
        <span class="ml-1 text-3xl font-extrabold tracking-tight bg-gradient-to-r from-blue-400 via-cyan-400 to-purple-500 bg-clip-text text-transparent animate-gradient-x">Hamada
                Portfolio</span>
    </div>
    <nav class="flex gap-2 md:gap-6 text-base font-semibold">
        <a href="#home" class="nav-link relative px-2 py-1 group transition-colors duration-200 whitespace-nowrap">
            <span class="group-hover:text-blue-400 transition">Home</span>
            <span class="absolute left-0 -bottom-1 w-0 h-0.5 bg-gradient-to-r from-blue-400 to-purple-400 rounded group-hover:w-full transition-all duration-300"></span>
        </a>
        <a href="#about" class="nav-link relative px-2 py-1 group transition-colors duration-200 whitespace-nowrap">
            <span class="group-hover:text-blue-400 transition">About</span>
            <span class="absolute left-0 -bottom-1 w-0 h-0.5 bg-gradient-to-r from-blue-400 to-cyan-400 rounded group-hover:w-full transition-all duration-300"></span>
        </a>
        <a href="#portfolio" class="nav-link relative px-2 py-1 group transition-colors duration-200 whitespace-nowrap">
            <span class="group-hover:text-blue-400 transition">Portfolio</span>
            <span class="absolute left-0 -bottom-1 w-0 h-0.5 bg-gradient-to-r from-blue-400 to-purple-400 rounded group-hover:w-full transition-all duration-300"></span>
        </a>
        <div class="games-menu-wrapper">
            <button aria-controls="games-menu" aria-expanded="false" aria-haspopup="true"
                class="nav-link relative px-2 py-1 group transition-colors duration-200 whitespace-nowrap"
                id="games-menu-toggle" type="button">
                <span class="group-hover:text-blue-400 transition">Games <span aria-hidden="true">▾</span></span>
                <span class="absolute left-0 -bottom-1 w-0 h-0.5 bg-gradient-to-r from-blue-400 to-cyan-400 rounded group-hover:w-full transition-all duration-300"></span>
            </button>
            <div class="games-dropdown hidden" id="games-menu" role="menu">
                <a data-game-select="memory" href="#games" role="menuitem">🧠 Memory Match</a>
                <a data-game-select="reaction" href="#games" role="menuitem">⚡ Tes Reaksi</a>
                <a data-game-select="number" href="#games" role="menuitem">🔢 Tebak Angka</a>
                <a data-game-select="snake" href="#games" role="menuitem">🐍 Snake Arcade</a>
                <a data-game-select="tictactoe" href="#games" role="menuitem">⭕ Tic-Tac-Toe</a>
                <a data-game-select="whack" href="#games" role="menuitem">🔨 Whack-a-Mole</a>
                <a data-game-select="pong" href="#games" role="menuitem">🏓 Pong</a>
            </div>
        </div>
        <a href="#contact" class="nav-link relative px-2 py-1 group transition-colors duration-200 whitespace-nowrap">
            <span class="group-hover:text-blue-400 transition">Contact</span>
            <span class="absolute left-0 -bottom-1 w-0 h-0.5 bg-gradient-to-r from-blue-400 to-cyan-400 rounded group-hover:w-full transition-all duration-300"></span>
        </a>
    </nav>
</header>
