<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#111827">
    <title>Portfolio Hamada - Frontend Website Engineer</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-gradient-to-br from-gray-900 via-gray-950 to-gray-800 text-white font-sans">
    <div id="component-header"></div>
    <main>
        <div id="component-hero"></div>
        <div id="component-about"></div>
        <div id="component-portfolio"></div>
        <div id="component-games"></div>
        <div id="component-contact"></div>
        <div id="component-social"></div>
    </main>
    <div id="component-footer"></div>
    <button aria-hidden="true" aria-label="Kembali ke atas" class="back-to-top-button"
        id="back-to-top" tabindex="-1" type="button">
        <svg aria-hidden="true" fill="none" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="m5 12 7-7 7 7M12 19V5" stroke="currentColor" stroke-linecap="round"
                stroke-linejoin="round" stroke-width="2"></path>
        </svg>
    </button>
    <div id="component-image-modal"></div>
    <script src="js/app.js" defer></script>
</body>
</html>
